{# Shared UI building blocks used across multiple pages. #}

{% macro page_header(icon, title, subtitle=None) %}
<div class="page-header">
    <div class="page-header-icon"><i class="bi {{ icon }}"></i></div>
    <div class="page-header-text">
        <p class="page-header-title">{{ title }}</p>
        {% if subtitle %}<p class="page-header-subtitle">{{ subtitle }}</p>{% endif %}
    </div>
</div>
{% endmacro %}
